[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "restaurantops-ai"
version = "0.1.0"
description = "A student backend for recipe-based inventory and restaurant analytics"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "SQLAlchemy==2.1.4",
  "psycopg[binary]==3.3.6", "pandas==3.0.6", "numpy==2.5.3",
  "celery==5.6.3", "redis==8.1.0", "openai==3.26.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
